<style>
body{font-family:Arial;background:#eef2f5;max-width:900px;margin:auto;padding:16px}
.card{background:#fff;border-radius:12px;padding:16px;margin:12px 0}
.row{display:flex;gap:4px;align-items:center;margin:6px 0}
.grow{flex:1}
input,textarea{width:100%;box-sizing:border-box;padding:8px;border:1px solid #ccc;border-radius:6px}
button{background:#1677ff;color:#fff;border:0;border-radius:6px;padding:8px 8px;cursor:pointer;white-space:nowrap;font-size:12px}
.check-btn{background:#fff;border:1px solid #ccc;width:38px;height:35px;font-size:18px;border-radius:6px;cursor:pointer}
.checked{background:#d4edda;border-color:#28a745}
.linkbox{border:1px solid #ddd;border-radius:10px;padding:10px;margin:10px 0}
summary{cursor:pointer;font-weight:bold;padding:10px;background:#f9f9f9;border-radius:8px}
.num-label{width:30px;font-size:12px;color:#666;flex-shrink:0;text-align:center}

.shortcut-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:12px}
.shortcut-btn{background:#f0f3f8;color:#222;border:1px solid #e0e0e0;border-radius:10px;padding:14px 4px;font-size:15px;font-weight:bold;text-align:center;width:100%}
.shortcut-btn:active{background:#dce8ff}
.shortcut-edit{border:1px solid #ddd;border-radius:10px;padding:10px;margin-top:10px}
.shortcut-edit input{margin-bottom:8px;font-size:14px}
.shortcut-edit label{display:block;font-size:12px;color:#666;margin-bottom:4px}

@media(max-width:400px){
.shortcut-grid{gap:6px}
.shortcut-btn{font-size:13px;padding:12px 2px}
}
</style>
</head>

<div class="card">

</div>

        <button id="btn-reset-mail" style="background:#666">Reset Mail</button>
    </div>
</div>

<div class="card">

    </div>

    <div id="shortcutButtons" class="shortcut-grid"></div>

    <div id="shortcutEditor" style="display:none">
        <div id="shortcutEditContainer"></div>
        <div style="display:flex;gap:8px;margin-top:12px">
            <button id="btn-save-shortcuts" style="background:#28a745;flex:1;font-size:14px">💾 Lưu</button>
            <button id="btn-cancel-shortcuts" style="background:#666;flex:1;font-size:14px">Hủy</button>
        </div>
    </div>
</div>

<div class="card">
    <h3>🎁 3 Link Giftuto (Nhanh)</h3>
    <div id="quickGiftutoContainer" style="margin-top:10px"></div>
</div>

<div class="card">
    <details>
        <summary>🎁 10 Link Giftuto</summary>
        <div id="giftutoContainer" style="margin-top:10px"></div>
    </details>
</div>

<div class="card">
    <details>
        <summary>🔗 10 Link nhanh</summary>

    </details>
</div>

<div class="card">
    <details>
        <summary>📶 31 WiFi (4 Cột: 2x 2.4G & 2x 5G)</summary>
        <div id="wifiContainer" style="margin-top:10px"></div>
    </details>
</div>

<div class="card">
    <details>
        <summary>👤 200 Account (2 Cột Tích ✅)</summary>
        <div style="display:flex;gap:6px;margin:10px 0;flex-wrap:wrap">
            <button id="btn-copy-all-names" style="background:#28a745;flex:1;min-width:140px">📋 Copy tất cả Tên</button>
            <button id="btn-reset-acc1" style="background:#faad14;flex:1;min-width:140px">Reset Tích Cột 1 🔄</button>
            <button id="btn-reset-acc2" style="background:#ff4d4f;flex:1;min-width:140px">Reset Tích Cột 2 🔄</button>
        </div>
        <div id="accContainer"></div>
    </details>
</div>

<div class="card">
    <details>
        <summary>👤 1000 Acc</summary>
        <div style="display:flex;gap:8px;margin:10px 0">
            <button id="btn-copy-all-1000" style="background:#28a745;flex:1">📋 Copy tất cả Tên 1000 Acc</button>
            <button id="btn-reset-1000" style="background:#ff4d4f;flex:1">Reset tất cả dấu tích ✅</button>
        </div>
        <div id="acc1000Container"></div>
    </details>
</div>

<div class="card">
    <h3>📝 Ghi chú</h3>
    <textarea id="note" rows="4"></textarea>
</div>
